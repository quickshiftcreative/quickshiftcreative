<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProSight | Listing Intelligence</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); 
            color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 50px 20px; 
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 40px; width: 100%; max-width: 800px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h1 { text-align: center; margin-bottom: 20px; color: #00d2ff; }
        .input-group { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        input[type="text"] {
            width: 100%; padding: 15px; border-radius: 8px; border: none; outline: none;
            background: rgba(255, 255, 255, 0.1); color: #fff; font-size: 16px;
        }
        input::placeholder { color: #bbb; }
        button {
            padding: 15px 30px; border-radius: 8px; border: none; background: #00d2ff; color: #000;
            font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; width: 100%;
        }
        button:hover { background: #3a7bd5; color: #fff; }
        .loader { display: none; text-align: center; margin: 20px 0; font-style: italic; color: #00d2ff; }
        .results-box {
            display: none; background: rgba(0,0,0,0.4); padding: 20px; border-radius: 10px; margin-top: 20px;
        }
        .metric { margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .metric-title { font-weight: bold; color: #00d2ff; font-size: 14px; text-transform: uppercase; }
        .metric-value { font-size: 18px; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="glass-panel">
        <h1>ProSight Analyzer</h1>
        <p style="text-align: center; margin-bottom: 20px; color: #ccc;">Enter Amazon URL to extract deep B2B analytics.</p>
        
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Paste Amazon product link here...">
            <button onclick="analyzeListing()">Analyze Listing</button>
        </div>

        <div class="loader" id="loader">Extracting & Analyzing Data... Please wait...</div>

        <div class="results-box" id="results">
            <div class="metric">
                <div class="metric-title">Current Title</div>
                <div class="metric-value" id="res-title">-</div>
            </div>
            <div class="metric">
                <div class="metric-title">Buy Box Status & Brand</div>
                <div class="metric-value" id="res-buybox">-</div>
            </div>
            <div class="metric">
                <div class="metric-title">Estimated FBA Profit (ROI)</div>
                <div class="metric-value" id="res-profit">-</div>
            </div>
            <div class="metric">
                <div class="metric-title">AI Optimized SEO Title</div>
                <div class="metric-value" id="res-ai" style="color: #00ff88;">-</div>
            </div>
        </div>
    </div>

    <script>
        // Aapka Asli Render URL yahan add kar diya gaya hai
        const BACKEND_URL = "https://quickshiftcreative-im.onrender.com"; 

        async function analyzeListing() {
            const url = document.getElementById('urlInput').value;
            if(!url) return alert("Please enter an Amazon URL first.");

            document.getElementById('loader').style.display = 'block';
            document.getElementById('results').style.display = 'none';

            try {
                const response = await fetch(`${BACKEND_URL}/analyze?url=${encodeURIComponent(url)}`);
                const data = await response.json();

                if(data.Status === "Success") {
                    document.getElementById('res-title').innerText = data.Core_Data.Title;
                    document.getElementById('res-buybox').innerText = `Winner: ${data.Core_Data.BuyBox_Owner} | Brand: ${data.Core_Data.Brand}`;
                    document.getElementById('res-profit').innerText = `Profit: ${data.Financials.Est_Net_Profit} | ROI: ${data.Financials.ROI}`;
                    document.getElementById('res-ai').innerText = data.AI_Fixer.Optimized_Title;
                    
                    document.getElementById('results').style.display = 'block';
                } else {
                    alert("Error: " + data.Message);
                }
            } catch (error) {
                alert("Server connection error. Ensure your link is correct.");
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }
    </script>
</body>
</html>
